// Do any local configuration here
//

include "/etc/bind/zones.rfc1918";

acl friends {
	localnets;
	::1;
	172.17/16;
};

acl clients {
	any;
};

acl slaves {
	localnets;
	localhost;
	172.17/16;
	104.40.176.216;		# u1 - public
	173.244.206.26;		# buddy dns
	88.198.106.11;
	108.61.224.67;
	103.6.87.125;
	185.136.176.247;	# buddy dns
	86.91.39.114;		# stratusplein
	127.0.0.53;
};

options {
	version "";	// remove this to allow version queries
	listen-on    { any; };
	listen-on-v6 { any; };
	empty-zones-enable yes;
	allow-recursion { clients; };
	allow-query { clients; };
	notify yes;
	directory "/var/named";
	managed-keys-directory "/var/named";
	response-policy { zone "rpz.xyz9.net"; };
};

logging {
	channel log {
		file "/var/named/named.log" versions 3 size 50m;
		severity dynamic;
		print-category yes;
		print-severity yes;
		print-time yes;
	};
	category config		{ log; };
	category default	{ log; };
	category general	{ log; };
	category update		{ log; };
	category security	{ log; };
	category rpz		{ log; };
	category queries	{ log; };
	category xfer-in	{ log; };
	category xfer-out	{ log; };
};

key update {
  algorithm hmac-md5;
  secret "4/1y0x76rhAiRwiJPVar9g==";
};

zone "xyz9.net" {
	type master;
	file "/var/named/db.xyz9";
	allow-query { clients; };
	allow-update { key update; };
	allow-transfer { slaves; };
};

zone "sp.xyz9.net" {
	type master;
	file "/var/named/db.sp.xyz9";
	allow-update { key update; };
	allow-transfer { slaves; };
	allow-query { clients; };
};

zone "rpz.xyz9.net" {
	type master;
	file "/var/named/db.rpz.xyz9";
	allow-update { key update; };
	allow-transfer { slaves; };
	allow-query { none; };
};

zone "17.172.in-addr.arpa" {
	type master;
	file "/var/named/db.arpa";
	allow-update { key update; };
	allow-transfer { slaves; };
	allow-query { clients; };
};

