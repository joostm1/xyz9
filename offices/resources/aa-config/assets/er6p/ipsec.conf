config setup
  charondebug=ike 1,knl 1,cfg 1
  uniqueids=no
conn %default
  ike=aes256-sha256-modp2048,aes256-sha256-modp1024!
  esp=aes256-sha256-modp2048,aes256-sha256-modp1024!
  keyexchange=ikev2
  compress=no
   # Edgerouter Cavium offload does not support compression
   # dmesg: cavium_alloc_n_fill: Protocol type not valid

ca XYZ9
  cacert=/config/auth/cacer.pem
  auto=add

conn sp1-dc1
  leftcert=/config/auth/egx.pem
  left=egx.xyz9.net
  leftsubnet=172.17.114.0/24
  rightsubnet=172.16.0.0/16,fd17:0:0:0::/52
  rightid=nvadc1.xyz9.net
  right=nvadc1-ipv4.xyz9.net
  # Edgrerouters can't tunnel IPv4 in IPv6. Kernel too old
  auto=start


conn sp1-dc2
  leftcert=/config/auth/egx.pem
  left=egx.xyz9.net
  leftsubnet=172.17.114.0/24
  rightsubnet=192.168.0.0/16,fd19:0:0:0::/52
  rightid=nvadc2.xyz9.net
  right=nvadc2-ipv4.xyz9.net
  # Edgrerouters can't tunnel IPv4 in IPv6. Kernel too old
  auto=start


