config setup
	charondebug="ike 1, knl 1, cfg 1"
	uniqueids=no

conn %default
	ike=aes256-sha256-modp2048,aes256-sha256-modp1024!
	esp=aes256-sha256-modp2048,aes256-sha256-modp1024!
	keyexchange=ikev2
	compress=no
ca XYZ9
	cacert=/config/auth/cacer.pem
	auto=add

conn xyz9-pubk
	left=%any
	leftauth=pubkey
	leftcert=/config/auth/egx.xyz9.net-cer.pem
	leftsendcert=always
	leftsubnet=0.0.0.0/0
	rightid=%any
	rightsourceip=192.168.223.0/24
	rightdns=8.8.8.8
	rightauth=pubkey
	auto=add

conn xyz9-az
	leftcert=/config/auth/egx.xyz9.net-cer.pem
	left=egx.xyz9.net
	right=nvadev.xyz9.net
	rightsubnet=172.16.0.32/27,fd17:0:0:1::/64
	auto=start



