# Monthly resources apply on Microsoft-hosted Azure Pipelines.
# aa-config owns definition xyz9sp1-apply and publishes the ~/.tfbackend.hcl keys
# (plus corp_vault_id) as pipeline variables. This job writes those files, then
# make applies every root. A hosted agent still needs an Azure CLI login that can
# read the state account and xz9kviac, and a network path to opi-private.
trigger: none
pr: none
schedules:
- cron: "0 6 1 * *"
  displayName: Monthly apply
  branches:
    include:
    - develop
  always: true
pool:
  vmImage: ubuntu-latest
jobs:
- job: apply
  timeoutInMinutes: 180
  steps:
  # Checkout folder is offices. make sets project_name from that directory,
  # which selects offices-config. Certificate objects keep the xyz9sp1- prefix.
  # State lives in container offices.
  - checkout: self
    path: offices
    submodules: true
    persistCredentials: true
  - script: |
      set -eu
      sudo apt-get update -qq
      sudo apt-get install -y -qq unzip rsync jq openssh-client
      if ! command -v terraform >/dev/null 2>&1; then
        zip_url=$(curl -fsSL https://api.releases.hashicorp.com/v1/releases/terraform/latest | jq -er '[.builds[] | select(.os=="linux" and .arch=="amd64") | .url][0]')
        curl -fsSL -o /tmp/terraform.zip "$zip_url"
        sudo unzip -qo /tmp/terraform.zip -d /usr/local/bin
        sudo chmod 755 /usr/local/bin/terraform
      fi
      command -v terraform >/dev/null
      command -v jq >/dev/null
      command -v python3 >/dev/null
      command -v ssh >/dev/null
      command -v rsync >/dev/null
      command -v az >/dev/null
      az account show >/dev/null
    displayName: Install toolchain
  - script: |
      set -eu
      umask 077
      cat > "$HOME/.tfbackend.hcl" <<EOF
      resource_group_name  = "${RESOURCE_GROUP_NAME}"
      storage_account_name = "${STORAGE_ACCOUNT_NAME}"
      subscription_id      = "${SUBSCRIPTION_ID}"
      tenant_id            = "${TENANT_ID}"
      EOF
      cat > "$HOME/.tfvars" <<EOF
      corp_vault_id        = "${CORP_VAULT_ID}"
      resource_group_name  = "${RESOURCE_GROUP_NAME}"
      storage_account_name = "${STORAGE_ACCOUNT_NAME}"
      tenant_id            = "${TENANT_ID}"
      EOF
    displayName: Write backend config and tfvars
    env:
      RESOURCE_GROUP_NAME: $(resource_group_name)
      STORAGE_ACCOUNT_NAME: $(storage_account_name)
      SUBSCRIPTION_ID: $(subscription_id)
      TENANT_ID: $(tenant_id)
      CORP_VAULT_ID: $(corp_vault_id)
  # make init passes -upgrade and would float providers past the lock file.
  - script: |
      set -eu
      for root in aa-ca aa-config; do
        terraform -chdir="resources/${root}" init -input=false \
          -backend-config="$HOME/.tfbackend.hcl" \
          -backend-config=container_name=offices \
          -backend-config=key="${root}.tfstate" \
          -reconfigure
      done
    displayName: terraform init
  - script: make apply
    workingDirectory: resources
    displayName: make apply
